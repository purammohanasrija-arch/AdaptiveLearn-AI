services:
  # =============================================================
  # ADAPTIVELEARN AI — UNIFIED FULL-STACK SERVICE (FastAPI + React)
  # Multi-stage Docker build: Frontend SPA + Backend Python Engine
  # =============================================================
  - type: web
    name: adaptivelearn-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 120
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 30
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
